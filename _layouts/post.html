---
layout: default
---
<article class="post-page">
  <p class="eyebrow">Field note</p>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%d %B %Y" }}</p>
  <div class="post-body">{{ content }}</div>
  <a class="text-link" href="{{ '/' | relative_url }}#blog">← Back to notes</a>
</article>
